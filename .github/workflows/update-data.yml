name: 更新資料

on:
  schedule:
    # 週一至週五(台銀假日不掛牌)。分鐘刻意選冷門值:
    # GitHub 排程在每小時開頭(:00 :05 :15 :30)高負載,常延遲數十分鐘甚至整輪跳過。
    # 2026-09 起冷門分鐘也延遲 4.5~6.5 小時,改由內網主機在同樣三個時間以 workflow_dispatch
    # 準時觸發(deploy/trigger-update.ps1);這裡的 cron 保留當備援。
    - cron: '23 1 * * 1-5'    # UTC 01:23 = 台北 09:23,台銀開盤後,先確保有前一日牌告與當週燃油
    - cron: '47 8 * * 1-5'    # UTC 08:47 = 台北 16:47,收盤後,嘗試取得當日牌告
    - cron: '43 10 * * 1-5'   # UTC 10:43 = 台北 18:43,保險:已驗證此時段必定取得當日牌告
    #
    # 為什麼要三次:資料源何時發布當日牌告未經完整驗證——
    # 只確認過台北 17:24 拿得到當日、09:02 只有前一日。16:47 是否來得及尚待觀察,
    # 故保留 18:43 這輪兜底。累積幾天紀錄確認 16:47 可行後,可移除第三筆。
  workflow_dispatch:        # 也可在 Actions 頁面手動執行

permissions:
  contents: write
  issues: write            # 失敗時自動開 issue 通知

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 目前排程用到的腳本全部只用 Python 標準庫,這步實際上不會裝到東西。
      # 仍保留的原因:先前加運費積木時,腳本需要 PyMuPDF 卻沒有對應的安裝步驟,
      # 而其餘腳本因為只用標準庫仍會通過,本機開發又早已裝好套件,結果是
      # 「本機能跑、CI 不能跑」而且只有那一步紅。留著這步,日後新積木只要把
      # 套件寫進 requirements.txt 就會生效,不會再踩同一個坑。
      - name: 安裝相依套件
        run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      # 各來源一律 continue-on-error:單一來源掛掉不該讓其他抓好的資料無法入庫。
      # 失敗與否在最後一步統一回報,確保執行紀錄仍然是紅的、不會被忽略。
      # ---------------------------------------------------------------
      - name: 抓取匯率(臺灣銀行牌告)
        id: rates
        continue-on-error: true
        run: python scripts/fetch_rates.py

      # 燃油附加費:DHL 自動抓,FedEx 讀 data/fuel_manual.json(人工每週維護)
      # 產出的 data/fuel.json 供內部運費試算工具跨域取用
      - name: 抓取燃油附加費
        id: fuel
        continue-on-error: true
        run: python scripts/fetch_fuel.py

      - name: 抓取紡織產業新聞
        id: news
        continue-on-error: true
        run: python scripts/fetch_news.py

      - name: 抓取品牌客戶動態
        id: brands
        continue-on-error: true
        run: python scripts/fetch_brands.py

      - name: 抓取原物料價格
        id: materials
        continue-on-error: true
        run: python scripts/fetch_materials.py

      # 運費公告價(data/freight.json)刻意不放在這裡:
      #   1. 兩家都是「年度」價目表(DHL 1/1、FedEx 1/5 生效),一年才換一次,
      #      每天抓三次、下載 6 MB PDF 重新解析,得到的永遠是同一份資料。
      #   2. FedEx 的 Akamai 會擋 GitHub 機房 IP(下載到的不是 PDF),
      #      在 Actions 裡根本抓不到,必須從台灣的網路環境執行。
      # 因此改為本機產生後提交,並由 freight-annual-check.yml 每月檢查是否該換年度版。

      # 未來新增積木時,在這裡照上面的格式加一步(記得補 id 與 continue-on-error,
      # 並在「回報失敗來源」那步加一行 check)

      # if: always() —— 前面任一來源失敗時仍要執行,把成功抓到的資料存進去
      - name: 有變動才 commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "資料無變動,略過 commit"
          else
            git commit -m "資料自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # 有任何來源失敗就讓整個 job 判定為失敗,才不會安靜地壞掉沒人發現
      # 彙整失敗來源。這步本身不讓 job 失敗——否則後面開/關 issue 會被跳過;
      # 真正把執行結果標紅的是最後一步。
      - name: 彙整失敗來源
        id: report
        if: always()
        run: |
          failed=""
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 抓取失敗($2)"
              failed="${failed:+$failed、}$1"
            fi
          }
          check 匯率        "${{ steps.rates.outcome }}"
          check 燃油附加費  "${{ steps.fuel.outcome }}"
          check 紡織產業新聞 "${{ steps.news.outcome }}"
          check 品牌客戶動態 "${{ steps.brands.outcome }}"
          check 原物料價格  "${{ steps.materials.outcome }}"
          [ -z "$failed" ] && echo "全部來源皆正常"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # 壞掉要有人知道:DHL 燃油曾從 9/4 壞到 9/17,執行紀錄一路是紅的卻沒人查看。
      # 改成自動開 issue,GitHub 會寄通知。同一組失敗來源只開一張,避免每天洗版。
      - name: 失敗時開 issue 通知
        if: always() && steps.report.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.report.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="資料更新失敗:$FAILED"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -qF "$TITLE"; then
            echo "已有相同的未關閉 issue,不重複建立"
            exit 0
          fi
          cat > body.md <<EOF
          以下來源抓取失敗,**其餘來源的資料仍已正常更新入庫**。

          - 失敗來源:$FAILED
          - 執行紀錄:$RUN_URL
          - 台北時間:$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')

          下次排程若恢復正常,這張 issue 會自動關閉。
          連續多日沒有自動關閉,表示來源端真的有變動,需要人工查看。
          EOF
          gh issue create --title "$TITLE" --body-file body.md
          echo "已建立提醒 issue:$TITLE"

      - name: 恢復正常就關閉先前的失敗 issue
        if: always() && steps.report.outputs.failed == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nums=$(gh issue list --state open --limit 100 --json number,title                  --jq '.[] | select(.title | startswith("資料更新失敗:")) | .number')
          for n in $nums; do
            gh issue close "$n" --comment "資料更新已恢復正常,自動關閉。"
            echo "已關閉 issue #$n"
          done

      # 放在最後:讓執行紀錄確實是紅的,不會變成表面成功實際壞掉
      - name: 讓執行結果反映失敗
        if: always() && steps.report.outputs.failed != ''
        run: |
          echo "失敗來源:${{ steps.report.outputs.failed }}"
          exit 1
